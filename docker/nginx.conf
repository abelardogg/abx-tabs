server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de alphaTab son inmutables y pesados (el soundfont ronda
    # 1,4 MB y cada panel abierto lo pide), así que conviene cachearlos.
    # Una sola cabecera: la directiva `expires` genera su propio Cache-Control
    # y junto a `add_header` se emitían dos, que los proxies resuelven de
    # formas distintas.
    location ~ ^/(font|soundfont)/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;
}
